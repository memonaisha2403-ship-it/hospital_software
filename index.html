VW.doctor_set=()=>{const u=db.users.find(z=>z.u==me.u),pf=u.prof||{};return`<div class=card><h3>My profile &amp; prescription header</h3>${al('These details are printed on YOUR prescriptions and consultation reports. Enter only verified information; empty fields are left out. Nothing is invented.','i')}<div class=g>${S('dp_use','Use my details on my documents',[['1','Yes – my details'],['0','No – hospital header']],pf.use===false?'0':'1')}${F('dp_nm','Clinic / hospital name shown in header',pf.clinic||'')}${F('dp_q','Qualification (e.g. MBBS, MD)',u.qual||'')}${F('dp_sp','Specialization',pf.spec||'')}${F('dp_rg','Medical registration number (verified only)',pf.reg||'')}${F('dp_ph','Phone',pf.phone||'')}${F('dp_em','Email',pf.email||'')}${TA('dp_ad','Clinic address',pf.addr||'')}</div><label>Note printed at the end of my prescriptions (optional)<textarea id=dp_nt rows=2>${E(pf.note||'')}</textarea></label><br><button class="btn p" onclick="svProf()">${ic('save')}Save profile</button> <button class=btn onclick="svProf(1)">${ic('eye')}Save &amp; preview header</button></div>
<div class=card><h3>My logo</h3>${pf.logo?`<img src="${pf.logo}" alt="my logo" style="max-height:80px;max-width:100%;width:auto;height:auto;display:block;margin-bottom:8px"><p class=mu>${pf.lw}×${pf.lh}px. Printed unchanged (original proportions) in the header of my documents.</p>`:al('No logo uploaded. Without one, the hospital logo is used. The system never draws or substitutes a logo.','i')}<label>${pf.logo?'Replace logo':'Upload logo'} (PNG/JPG, max 1.5 MB)<input type=file accept="image/png,image/jpeg,image/webp" onchange="profLogo(this)"></label>${pf.logo?'<br>'+bt('Remove logo','trash','profLogoRm()'):''}</div>
<div class=card><h3>My signature</h3><p>${u.sig?'A signature image is saved and is printed on my prescriptions and consultation reports.':'No signature image saved. Documents show a signature line.'}</p>${bt('Set my signature & qualification','edit',`sigM('${me.u}')`)}</div>`};
function profGet(){const u=db.users.find(z=>z.u==me.u),o=u.prof||{};u.qual=g('dp_q');return{...o,use:g('dp_use')!='0',clinic:g('dp_nm'),spec:g('dp_sp'),reg:g('dp_rg'),phone:g('dp_ph'),email:g('dp_em'),addr:g('dp_ad'),note:g('dp_nt')}}
function svProf(pr){if(!only('doctor'))return;const u=db.users.find(z=>z.u==me.u);u.prof=profGet();lg('Doctor profile saved');if(!sv())return;if(pr)pv('docprev','DP00000');else{tt('Profile saved');render()}}
function profLogoRm(){if(!only('doctor'))return;const u=db.users.find(z=>z.u==me.u),pf=profGet();delete pf.logo;u.prof=pf;lg('Doctor logo removed');sv();render()}
function profLogo(inp){const f=inp.files[0];if(!f||!only('doctor'))return;if(!/^image\/(png|jpeg|webp)$/.test(f.type))return tt('Please choose a PNG or JPG image','e');if(f.size>1.5e6)return tt('Logo file is too large (max 1.5 MB)','e');const u=db.users.find(z=>z.u==me.u),r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let d0=r.result,fmt=f.type=='image/jpeg'?'JPEG':'PNG';const w=im.naturalWidth,h=im.naturalHeight;if(f.type=='image/webp'){const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0);d0=c.toDataURL('image/png')}const pf=profGet();pf.logo=d0;pf.lw=w;pf.lh=h;pf.lf=fmt;const old=u.prof;u.prof=pf;lg('Doctor logo uploaded');if(sv()){tt('Logo saved');render()}else u.prof=old};im.onerror=()=>tt('Could not read this image','e');im.src=r.result};r.readAsDataURL(f)}
render();
